  flowerMessages:["You're amazing.","Keep smiling.","More memories are waiting.","You are truly special."]
};

const state={screen:1,pin:"",opened:[],photo:0,music:false,muted:false,letterOpen:false};
const app=document.getElementById("app");
let audio=null, unlockTimer=null;

function petals(n=24){return `<div class="petals">${Array.from({length:n},(_,i)=>`<i style="--x:${(i*37)%100}%;--t:${7+(i%6)}s;--d:-${i%8}s"></i>`).join("")}</div>`}
function dots(){return `<div class="dots">${[0,1,2,3].map((_,i)=>`<i class="${i<state.pin.length?'on':''}"></i>`).join("")}</div>`}
function progress(){return `<div class="progress">${Array.from({length:11},(_,i)=>`<i class="${i+1===state.screen?'on':''}"></i>`).join("")}</div>`}
function next(n){state.screen=n;render();window.scrollTo(0,0)}
function photoSrc(i){return CONFIG.photos[i]||""}

function render(){
let s="";
if(state.screen===1)s=`<section class="screen intro center"><div class="texture"></div><div class="botanical b1">🌿🌸</div><div class="botanical b2">🌸🌿</div>${petals(16)}<div class="introbox"><div class="eyebrow">A tiny birthday garden</div><h1>${CONFIG.introTitle}</h1><p>${CONFIG.introSubtitle}</p><div class="soft">${CONFIG.introLine}</div>${dots()}<div class="keypad">${["1","2","3","4","5","6","7","8","9","0","←"].map(k=>`<button class="${k==="0"?"zero":k==="←"?"back":""}" onclick="key('${k}')">${k}</button>`).join("")}</div></div></section>`;
if(state.screen===2)s=`<section class="screen unlock center">${petals(45)}<div class="orb"></div><div class="flowers">🌷🌸🌿🌸🌷</div><p>Welcome to your little garden...</p></section>`;
if(state.screen===3)s=`<section class="screen garden">${petals(22)}<div class="sky"></div><div class="sun"></div><div class="hill"></div><div class="hill hill2"></div><div class="tree ta">🌳</div><div class="tree tb">🌳</div><div class="gardenbox"><div class="eyebrow">Secret Garden</div><h2>Come wander a little...</h2><p>Tap the flowers. Some tiny messages are hiding among them.</p></div><div class="flowers">${CONFIG.flowerMessages.map((m,i)=>`<button class="flower f${i%4} ${state.opened.includes(i)?'open':''}" onclick="gardenFlower(${i})"><span>${["🌷","🌸","🌼","🌺"][i%4]}</span><small>${state.opened.includes(i)?m:"Tap me"}</small></button>`).join("")}</div>${state.opened.length>=Math.min(3,CONFIG.flowerMessages.length)?`<button class="primary next" onclick="next(4)">Continue →</button>`:""}</section>`;
if(state.screen===4)s=`<section class="screen paper center">${petals(15)}<div class="card"><div class="eyebrow">A little note for you</div><h2>Happy Birthday, ${CONFIG.birthdayName}</h2><div class="lead">Today is all about celebrating you.</div><div class="message">${CONFIG.personalMessage}</div><button class="primary" onclick="next(5)">Continue →</button></div></section>`;
if(state.screen===5)s=`<section class="screen section"><div class="sectionhead"><div class="eyebrow">Moments worth keeping</div><h2>Our Little Memories</h2><p>Tap any card to open the memory.</p></div><div class="memgrid">${CONFIG.photos.map((p,i)=>`<button class="mem" onclick="openPhoto(${i})"><div class="frame">${p?`<img src="${p}" alt="Memory ${i+1}">`:`🌸`}</div><b>Memory ${String(i+1).padStart(2,"0")}</b><small>${["A beautiful memory","One moment I'll always remember","A little piece of happiness","A memory worth keeping","More smiles, more memories"][i%5]}</small></button>`).join("")}</div><button class="primary" onclick="next(6)">Continue →</button></section>`;
if(state.screen===6)s=`<section class="screen dark"><div class="moon">☾</div>${petals(20)}<div class="sectionhead"><div class="eyebrow" style="color:#d9b6bd">A few tiny flowers</div><h2>Tap the flowers...</h2><p style="color:#d8c7cb">Each one has a little message for you.</p></div><div class="flowergrid">${CONFIG.flowerMessages.map((m,i)=>`<button class="bigflower ${state.opened.includes("x"+i)?"open":""}" onclick="openFlower(${i})"><span>${state.opened.includes("x"+i)?"🌷":"🌱"}</span><b>${state.opened.includes("x"+i)?m:"Open me"}</b></button>`).join("")}</div>${CONFIG.flowerMessages.every((_,i)=>state.opened.includes("x"+i))?`<div class="found reveal"><h3 class="serif">You found them all 🌷</h3><p>One final surprise is waiting...</p><button class="primary" onclick="next(7)">Open it</button></div>`:""}</section>`;
if(state.screen===7)s=`<section class="screen letter"><div class="eyebrow">A letter, just for you</div><h2>Something from the heart</h2><div class="envelope ${state.letterOpen?'open':''}"><div class="envback"></div><div class="letterpaper"><h3>Dear ${CONFIG.birthdayName},</h3><p>${CONFIG.letterMessage}</p></div><div class="envflap"></div></div>${state.letterOpen?`<button class="primary" onclick="next(8)">Continue →</button>`:`<button class="primary" onclick="state.letterOpen=true;render()">Open Letter</button>`}</section>`;
if(state.screen===8)s=`<section class="screen wall"><div class="sectionhead"><div class="eyebrow">Snapshots</div><h2>Photo Memory Wall</h2><p>Tap a photo for a closer look.</p></div><div class="wallgrid">${CONFIG.photos.map((p,i)=>`<button class="wallitem w${i}" onclick="openPhoto(${i})">${p?`<img src="${p}" alt="Memory ${i+1}">`:"🌸"}</button>`).join("")}</div><button class="primary" onclick="next(9)">Continue →</button></section>`;
if(state.screen===9)s=`<section class="screen music center"><div class="eyebrow">A little song for you...</div><h2>Music Moment</h2><div class="album">${photoSrc(0)?`<img src="${photoSrc(0)}" alt="Album artwork">`:"🌸"}</div><div class="visual">${[1,2,3,4,5].map(()=>"<i></i>").join("")}</div><button class="primary" onclick="toggleMusic()">${state.music?"Pause":"Play"} ♪</button><button class="primary" style="margin-top:10px;background:#ffffff99;color:#694c50" onclick="state.muted=!state.muted;if(audio)audio.muted=state.muted;render()">${state.muted?"Unmute":"Mute"}</button><p style="max-width:450px;color:#765d62">Music is optional. If no audio file is available, the visual moment still works.</p><button class="primary" onclick="next(10)">Continue →</button></section>`;
if(state.screen===10)s=`<section class="screen finalgarden center"><div class="stars"></div><div class="sun"></div>${petals(35)}<div class="gardenbox reveal"><div class="eyebrow" style="color:#e7c7c9">One more thing...</div><div class="heart">🌷</div><h2>There's just one more thing...</h2><p>Happy Birthday, ${CONFIG.birthdayName} ❤️</p><p>${CONFIG.finalMessage}</p><button class="primary" onclick="next(11)">See the final surprise →</button></div></section>`;
if(state.screen===11)s=`<section class="screen final center">${petals(35)}<div class="heart">💐</div><h1>Happy Birthday<br>${CONFIG.birthdayName} ❤️</h1><p class="message">${CONFIG.finalMessage}</p><p>Made with love by <b>${CONFIG.senderName}</b></p><button class="primary" onclick="resetAll()">Replay</button></section>`;
app.innerHTML=s+progress();
}

function key(k){
 if(k==="←"){state.pin=state.pin.slice(0,-1);render();return}
 if(state.pin.length>=CONFIG.pin.length)return;
 state.pin+=k;render();
 if(state.pin.length===CONFIG.pin.length){
   if(state.pin===CONFIG.pin){state.screen=2;render();unlockTimer=setTimeout(()=>next(3),1900)}
   else {const el=document.querySelector(".keypad");el?.classList.add("shake");setTimeout(()=>{state.pin="";render()},450)}
 }
}
function gardenFlower(i){if(!state.opened.includes(i))state.opened.push(i);render()}
function openFlower(i){if(!state.opened.includes("x"+i))state.opened.push("x"+i);render()}
function openPhoto(i){state.photo=i;const p=CONFIG.photos[i];document.getElementById("modal").classList.add("show");document.getElementById("modalImg").src=p||"";document.getElementById("modalCaption").textContent=CONFIG.photos[i]?["A beautiful memory","One moment I'll always remember","A little piece of happiness","A memory worth keeping","More smiles, more memories"][i%5]:"Memory "+(i+1)}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function movePhoto(d){state.photo=(state.photo+d+CONFIG.photos.length)%CONFIG.photos.length;openPhoto(state.photo)}
function toggleMusic(){
 if(!audio){audio=new Audio(CONFIG.music);audio.loop=true}
 if(state.music){audio.pause();state.music=false}else{audio.muted=state.muted;audio.play().then(()=>{state.music=true;render()}).catch(()=>alert("Add your birthday-song.mp3 or change CONFIG.music to a valid audio URL."));return}
 render()
}
function resetAll(){if(audio){audio.pause();audio.currentTime=0}state.screen=1;state.pin="";state.opened=[];state.photo=0;state.music=false;state.muted=false;state.letterOpen=false;render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
document.addEventListener("touchstart",e=>{if(e.target.closest(".modal")){window._sx=e.touches[0].clientX}}, {passive:true});
document.addEventListener("touchend",e=>{if(document.getElementById("modal")?.classList.contains("show")&&window._sx!=null){let dx=e.changedTouches[0].clientX-window._sx;if(Math.abs(dx)>60)movePhoto(dx<0?1:-1);window._sx=null}}, {passive:true});

render();
</script>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<button class="close" onclick="closeModal()">×</button>
<button class="navbtn prev" onclick="movePhoto(-1)">‹</button>
<div class="modalbox"><img id="modalImg" alt="Memory preview"><p id="modalCaption" class="serif" style="font-size:24px"></p></div>
<button class="navbtn nextb" onclick="movePhoto(1)">›</button>
</div>
</body>
</html>
